openapi: 3.0.3
info:
  title: Attendly API
  version: 1.0.0
  description: |
    Track sessions, who attended which time slot, what each member owes, and what they paid.

    **Billing rule:** for each time slot, `units_booked × unit_rate` is split evenly between
    the members in that slot. A member's session bill is the sum over the slots they attended.

    **Ledger:** `balance = total_paid - total_bill`. Negative means the member owes money.
    Unpaid amounts carry forward because the ledger is computed across all sessions.

    Every endpoint except `/health`, `/register`, `/login` and `/docs` needs
    `Authorization: Bearer <token>` from `/login`.
servers:
  - url: /
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Sessions
  - name: Time slots
  - name: Members
  - name: Payments

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /register:
    post:
      tags: [Auth]
      summary: Create a user account
      description: Returns 403 when the server runs with `ALLOW_REGISTRATION=false`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Host }
                email: { type: string, format: email, example: host@example.com }
                password: { type: string, minLength: 8, example: supersecret }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /login:
    post:
      tags: [Auth]
      summary: Log in and get a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Error" }

  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions, newest first, with slots and members
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Sessions]
      summary: Create a session
      description: With `hourly_slots=true`, one slot per hour is created, each with `default_units` units. A trailing part-hour becomes a shorter slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_time, end_time]
              properties:
                start_time: { type: string, format: date-time, example: "2026-09-27T18:00:00+05:30" }
                end_time: { type: string, format: date-time, example: "2026-09-27T22:00:00+05:30" }
                unit_rate: { type: number, minimum: 0, example: 300 }
                hourly_slots: { type: boolean, example: true }
                default_units: { type: integer, minimum: 0, example: 2 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Sessions]
      summary: Get a session with its slots and members
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Sessions]
      summary: Delete a session, its slots and attendance
      description: Refused with 409 if any payments are recorded against the session.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{id}/timeslots:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [Time slots]
      summary: Add a time slot to a session
      description: The slot must fall within the session's start and end time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_time, end_time]
              properties:
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
                units_booked: { type: integer, minimum: 0, example: 2 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeSlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{id}/billing:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Sessions]
      summary: What each member owes for this session
      responses:
        "200":
          description: Bills, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberBill" }
        "404": { $ref: "#/components/responses/NotFound" }

  /timeslots/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    put:
      tags: [Time slots]
      summary: Change how many units were booked for a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                units_booked: { type: integer, minimum: 0, example: 1 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeSlot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Time slots]
      summary: Delete a slot and its attendance
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /timeslots/{id}/members:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [Time slots]
      summary: Mark a member as present in this slot
      description: Idempotent. Assigning an already-assigned member does nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id]
              properties:
                member_id: { type: integer, example: 1 }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /timeslots/{id}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: memberId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Time slots]
      summary: Remove a member from a slot
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /members:
    get:
      tags: [Members]
      summary: List members, sorted by name
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      tags: [Members]
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Alex }
                phone: { type: string, example: "9876543210" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /members/{id}/ledger:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [Members]
      summary: One member's balance, per-session breakdown and payments
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberLedger" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ledger:
    get:
      tags: [Members]
      summary: Every member's balance, biggest debts first
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }

  /payments:
    get:
      tags: [Payments]
      summary: List payments, newest first
      parameters:
        - { name: member_id, in: query, schema: { type: integer } }
        - { name: session_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      tags: [Payments]
      summary: Record a payment
      description: The member must have attended at least one slot of the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, session_id, amount]
              properties:
                member_id: { type: integer, example: 1 }
                session_id: { type: integer, example: 1 }
                amount: { type: number, exclusiveMinimum: true, minimum: 0, example: 300 }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payments/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      tags: [Payments]
      summary: Delete a payment recorded by mistake
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
    Member:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
    TimeSlot:
      type: object
      properties:
        id: { type: integer }
        session_id: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        units_booked: { type: integer }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    Session:
      type: object
      properties:
        id: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        unit_rate: { type: number }
        time_slots:
          type: array
          items: { $ref: "#/components/schemas/TimeSlot" }
    MemberBill:
      type: object
      properties:
        member_id: { type: integer }
        name: { type: string }
        amount: { type: number }
    LedgerEntry:
      type: object
      properties:
        member_id: { type: integer }
        name: { type: string }
        phone: { type: string }
        total_bill: { type: number }
        total_paid: { type: number }
        balance: { type: number, description: "total_paid - total_bill; negative means the member owes" }
    SessionCharge:
      type: object
      properties:
        session_id: { type: integer }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        slot_count: { type: integer }
        bill: { type: number }
        paid: { type: number }
    MemberLedger:
      allOf:
        - $ref: "#/components/schemas/LedgerEntry"
        - type: object
          properties:
            sessions:
              type: array
              items: { $ref: "#/components/schemas/SessionCharge" }
            payments:
              type: array
              items: { $ref: "#/components/schemas/Payment" }
    Payment:
      type: object
      properties:
        id: { type: integer }
        member_id: { type: integer }
        session_id: { type: integer }
        amount: { type: number }
        created_at: { type: string, format: date-time }
        member: { $ref: "#/components/schemas/Member" }
